name: Rotate Daily Block

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rotate the daily README block
        run: python3 .github/scripts/daily.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "nothing to commit" && exit 0
          git add README.md
          git commit -m "chore: rotate daily block ($(date -u +%F))"
          git push
