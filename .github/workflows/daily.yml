name: Rotate Daily Block

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rotate the daily README block
        run: python3 .github/scripts/daily.py

      - name: Refresh the achievement cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 assets/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/achievements.svg
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: daily refresh ($(date -u +%F))"
          git push
